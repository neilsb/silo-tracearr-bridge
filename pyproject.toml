[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "silo-tracearr-bridge"
version = "0.1.0"
description = "Jellyfin API bridge for monitoring Silo and terminating streams with Tracearr"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
silo-tracearr-bridge = "silo_tracearr.__main__:main"

[tool.setuptools.packages.find]
include = ["silo_tracearr*"]
